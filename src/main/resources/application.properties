spring.application.name=${APPLICATION_NAME:pmp-consumer}
server.port=${SERVER_PORT:8084}

spring.main.allow-bean-definition-overriding=true

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.listener.concurrency=3
spring.kafka.topic.name=${KAFKA_TOPIC_NAME:forget}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:pmp-consumer}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.bootstrap-servers=${spring.kafka.bootstrap-servers}
