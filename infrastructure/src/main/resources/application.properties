server.port=${SERVER_PORT}
spring.application.name=${APPLICATION_NAME}

# LOCALE
spring.mvc.locale-resolver=${LOCALE_RESOLVER}
spring.mvc.locale=${LOCALE}

# MySQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

# KAFKA
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.producer.max-block-ms=5000
spring.kafka.producer.bootstrap-servers=${spring.kafka.bootstrap-servers}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.topic.forget=forget
spring.kafka.replicas=${KAFKA_REPLICAS}
spring.kafka.partitions=${KAFKA_PARTITIONS}
spring.kafka.admin.auto-create-topics=true