server.port=8081
spring.application.name=login

# LOCALE
spring.mvc.locale-resolver=fixed
spring.mvc.locale=pt_BR

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/pmp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

# KAFKA
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.max-block-ms=5000
spring.kafka.producer.bootstrap-servers=${spring.kafka.bootstrap-servers}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.topic.forget=forget
spring.kafka.replicas=2
spring.kafka.partitions=5
spring.kafka.admin.auto-create-topics=true